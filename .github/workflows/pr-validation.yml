name: PR Validation

on:
  pull_request:
    branches:
      - dev
      - staging

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9' # Adjust based on your mobile/pubspec.yaml
          channel: 'stable'
          cache: true
          
      - name: Run Maven Tests (shared, backend, client)
        run: ./mvnw test -q
        
