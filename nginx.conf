server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Dynamic reverse proxy for /api resolving via Docker DNS
    location ^~ /api {
        resolver 127.0.0.11 valid=30s;
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single Page Application Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache Control: Never cache the core entry points
    location ~* \.(html|json|js)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Cache Control: Cache the static media assets
    location ~* \.(png|jpg|jpeg|gif|ico|svg|ttf|woff|woff2)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
